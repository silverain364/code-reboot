<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="container">
        <div class="wrap">
            <div class="title">
                <h1>소셜벤처를 먼저 만나는 펀딩</h1>
                <img src="./img/Border.png" alt="">
            </div>
            <ul class="list">
                <li>
                    <a href="#">
                        <div class="img_wrap">
                            <img src="./img/oranda.png" alt="">

                        <div class="content">
                            <div class="txt_wrap">
                                <p class="shop">우리밀</p>
                                <p class="product">국산 벌꿀과 버터로 만든 말랑꿀버터 오란다</p>

                    <a href="#">

                            <img src="./img/pig.png" alt="">

                                <p class="shop">한라산산골흑돼지</p>

                    <a href="#">
                        <div class="img_wrap">

                            <div class="txt_wrap">
                                <p class="shop">에코파티메아리</p>
                                <p class="product">비바람 막아주는 천막 업사이클 지갑&파우치</p>
                            </div>
                            <p class="percent">329%</p>
                        </div>

                </li>
            </ul>
        </div>
    </div>

</html>
